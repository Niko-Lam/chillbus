<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b3b3c" />
<title>搭車從容 ChillBus · 唔使再追巴士</title>
<meta name="description" content="實時巴士到站監控 × 步行時間規劃 × 出發提醒。計好你由出發點行去巴士站嘅時間，喺啱嘅一刻提醒你出門。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon.svg" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>

<div class="app" id="app">

  <!-- ===== Sidebar / bottom nav ===== -->
  <nav class="rail" id="rail" aria-label="主導覽">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><rect x="5" y="4" width="22" height="20" rx="5" fill="currentColor" opacity=".16"/><rect x="5" y="4" width="22" height="20" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="11" cy="26.5" r="2.4" fill="currentColor"/><circle cx="21" cy="26.5" r="2.4" fill="currentColor"/><path d="M9 10h14M9 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <strong>ChillBus</strong>
        <span>搭車從容啲</span>
      </div>
    </div>

    <ul class="nav" role="tablist">
      <li><button class="nav-btn is-active" data-view="go" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>出發</span></button></li>
      <li><button class="nav-btn" data-view="routes" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="3.5" width="16" height="14" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="20.5" r="1.6" fill="currentColor"/><circle cx="15" cy="20.5" r="1.6" fill="currentColor"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>路線</span></button></li>
      <li><button class="nav-btn" data-view="plan" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3v18M18 3v18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 8.5h7.5l3 3H6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>規劃</span></button></li>
      <li><button class="nav-btn" data-view="places" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5 10 4l4 2.5L20 4v13.5L14 20l-4-2.5L4 20V6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 4v13.5M14 6.5V20" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>地點</span></button></li>
    </ul>

    <div class="rail-foot">
      <button class="ghost-btn" id="btnSettings" title="設定">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m14.4-6.4-1.6 1.6M8.2 15.8 6.6 17.4m10.8 0-1.6-1.6M8.2 8.2 6.6 6.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>設定</span>
      </button>
      <button class="ghost-btn" id="btnNotif" title="通知權限">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 18.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span id="notifLabel">通知</span>
      </button>
    </div>
  </nav>

  <!-- ===== Main content ===== -->
  <main class="content" id="content">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="viewTitle">出發</h1>
        <p id="viewSubtitle">實時到站監控 · 出門提醒</p>
      </div>
      <div class="topbar-actions">
        <span class="net-pill" id="netPill" data-state="ok"><i></i><span>連線中…</span></span>
        <button class="icon-btn only-mobile" id="btnOpenMap" title="地圖" aria-label="開啟地圖">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5 10 4l4 2.5L20 4v13.5L14 20l-4-2.5L4 20V6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="view" id="view-go" role="tabpanel"></div>
    <div class="view" id="view-routes" role="tabpanel" hidden></div>
    <div class="view" id="view-plan" role="tabpanel" hidden></div>
    <div class="view" id="view-places" role="tabpanel" hidden></div>
  </main>

  <!-- ===== Map dock ===== -->
  <section class="map-dock" id="mapDock" aria-label="地圖">
    <div class="map-dock-bar">
      <div class="map-legend" id="mapLegend"></div>
      <button class="icon-btn" id="btnCloseMap" title="收起地圖" aria-label="收起地圖">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="map"></div>
    <div class="map-hint" id="mapHint" hidden></div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./assets/js/main.js"></script>
</body>
</html>
